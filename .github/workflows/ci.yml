name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: unit, integration, golden and compile-fail tests
        run: zig build test --summary all
      - name: example harness tests
        working-directory: examples/support
        run: zig build test --summary all
      - name: C ABI example (builds, links, runs; fake keys exercise the error paths)
        working-directory: examples/support
        env:
          ANTHROPIC_API_KEY: fake
          OPENAI_API_KEY: fake
        run: zig build embed
      - name: dev serve, driven by curl (fake keys exercise the error paths)
        run: bash tests/dev_serve_smoke.sh
      # Coverage-guided fuzzing of the parser, the round-trip property and
      # fuzzTool. A short run checks the fuzz build and catches regressions;
      # longer runs are local (`zig build fuzz --fuzz`).
      - name: fuzz (10K runs per test)
        run: zig build fuzz --fuzz=10K

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, aarch64-macos, x86_64-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: build the example
        working-directory: examples/support
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=small

  size-and-compile-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: size budgets (PLAN.md §5.6)
        run: zig build size
      # Runner speed varies, so the baseline (v1.0.0) is built on the same
      # runner, each build with fresh caches. v1.0.0 needs Zig 0.16.0; the
      # head uses the current Zig, so this compares what users see. The build
      # runner is compiled first, untimed: Zig 0.17 spends about a minute on
      # it in an empty cache, for any project. Fails above 1.5x (PLAN.md §12,
      # D55).
      - name: compile time of the example vs v1.0.0
        run: |
          git fetch -q --depth=1 origin tag v1.0.0
          git worktree add -q /tmp/base v1.0.0
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ -C /tmp
          # measure <checkout> <cache dir> <zig> <optimize>
          measure() {
            # Zig 0.16 fails to fetch .zip dependencies without a tmp/ directory.
            mkdir -p "$2/tmp"
            ( cd "$1/examples/support" &&
              export ZIG_GLOBAL_CACHE_DIR="$2" ZIG_LOCAL_CACHE_DIR="$2/local" &&
              "$3" build --help >/dev/null &&
              start=$(date +%s) &&
              "$3" build -Doptimize="$4" >&2 &&
              echo $(( $(date +%s) - start )) )
          }
          base=$(measure /tmp/base /tmp/cache-base /tmp/zig-x86_64-linux-0.16.0/zig ReleaseSmall)
          head=$(measure "$PWD" /tmp/cache-head zig small)
          echo "compile time: ${head}s, v1.0.0 on this runner: ${base}s"
          test $(( head * 2 )) -le $(( base * 3 ))
