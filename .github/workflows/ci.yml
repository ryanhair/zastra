name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Zig 0.16 fails to fetch .zip dependencies ("failed to create temporary
      # zip file") when the global cache has no tmp/ directory yet.
      - name: prepare the zig cache
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"
      - name: unit, integration, golden and compile-fail tests
        run: zig build test --summary all
      - name: example harness tests
        working-directory: examples/support
        run: zig build test --summary all
      - name: C ABI example (builds, links, runs; fake keys exercise the error paths)
        working-directory: examples/support
        env:
          ANTHROPIC_API_KEY: fake
          OPENAI_API_KEY: fake
        run: zig build embed

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, aarch64-macos, x86_64-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Zig 0.16 fails to fetch .zip dependencies ("failed to create temporary
      # zip file") when the global cache has no tmp/ directory yet.
      - name: prepare the zig cache
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"
      - name: build the example
        working-directory: examples/support
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

  size-and-compile-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Zig 0.16 fails to fetch .zip dependencies ("failed to create temporary
      # zip file") when the global cache has no tmp/ directory yet.
      - name: prepare the zig cache
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"
      - name: size budgets (PLAN.md §5.6)
        run: zig build size
      # Runner speed varies, so the baseline (v1.0.0) is built on the same
      # runner, each build with fresh caches. Fails above 1.5x (PLAN.md §12).
      - name: compile time of the example vs v1.0.0
        run: |
          git fetch -q --depth=1 origin tag v1.0.0
          git worktree add -q /tmp/base v1.0.0
          measure() {
            mkdir -p "$2/tmp"
            ( cd "$1/examples/support" && start=$(date +%s) &&
              zig build -Doptimize=ReleaseSmall --cache-dir "$2/local" --global-cache-dir "$2" >&2 &&
              echo $(( $(date +%s) - start )) )
          }
          base=$(measure /tmp/base /tmp/cache-base)
          head=$(measure "$PWD" /tmp/cache-head)
          echo "compile time: ${head}s, v1.0.0 on this runner: ${base}s"
          test $(( head * 2 )) -le $(( base * 3 ))
